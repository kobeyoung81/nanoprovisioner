# RBAC for the nanorunner k8s provisioner backend.
# Grants the runner permission to create/delete agent Deployments in its namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nanorunner
  namespace: myriadmind
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nanorunner
  namespace: myriadmind
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nanorunner
  namespace: myriadmind
subjects:
  - kind: ServiceAccount
    name: nanorunner
    namespace: myriadmind
roleRef:
  kind: Role
  name: nanorunner
  apiGroup: rbac.authorization.k8s.io
