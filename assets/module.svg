<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="nanoprovisioner: requests in, three backends, containers out">
  <title>nanoprovisioner</title>
  <defs>
    <style>
      .txt { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .chip { fill: #F1F5F9; }
      .card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 2; }
      .wire { stroke: #CBD5E1; stroke-width: 2; }
      .ink { fill: #0F172A; }
      .dim { fill: #64748B; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="420" fill="#FFFFFF"/>

  <g class="txt" font-size="13" fill="#334155">
    <rect class="chip" x="164" y="32" width="200" height="36" rx="10"/><text x="264" y="55" text-anchor="middle">nanobus</text>
    <rect class="chip" x="380" y="32" width="200" height="36" rx="10"/><text x="480" y="55" text-anchor="middle">nanoportal</text>
    <rect class="chip" x="596" y="32" width="200" height="36" rx="10"/><text x="696" y="55" text-anchor="middle">nanoadmin</text>
  </g>

  <g class="wire">
    <line x1="264" y1="68" x2="264" y2="90"/>
    <line x1="480" y1="68" x2="480" y2="90"/>
    <line x1="696" y1="68" x2="696" y2="90"/>
    <line x1="264" y1="90" x2="696" y2="90"/>
    <line x1="480" y1="90" x2="480" y2="110"/>
  </g>

  <rect x="280" y="110" width="400" height="56" rx="12" fill="#EEF2FF" stroke="#2F6BFF" stroke-width="2.5"/>
  <text class="txt ink" x="480" y="134" font-size="15" font-weight="700" text-anchor="middle">nanoprovisioner</text>
  <text class="txt dim" x="480" y="153" font-size="10.5" text-anchor="middle">container queue · tunnel endpoint · runner registry</text>

  <g class="wire">
    <line x1="480" y1="166" x2="480" y2="190"/>
    <line x1="264" y1="190" x2="696" y2="190"/>
    <line x1="264" y1="190" x2="264" y2="215"/>
    <line x1="480" y1="190" x2="480" y2="215"/>
    <line x1="696" y1="190" x2="696" y2="215"/>
  </g>

  <g class="txt" text-anchor="middle">
    <rect class="card" x="164" y="215" width="200" height="46" rx="10"/><text class="ink" x="264" y="236" font-size="13" font-weight="600">Docker</text><text class="dim" x="264" y="253" font-size="10.5">one host, one socket</text>
    <rect class="card" x="380" y="215" width="200" height="46" rx="10"/><text class="ink" x="480" y="236" font-size="13" font-weight="600">Swarm</text><text class="dim" x="480" y="253" font-size="10.5">services and replicas</text>
    <rect class="card" x="596" y="215" width="200" height="46" rx="10"/><text class="ink" x="696" y="236" font-size="13" font-weight="600">Kubernetes</text><text class="dim" x="696" y="253" font-size="10.5">pods, PVCs, RBAC</text>
  </g>

  <g class="wire">
    <line x1="264" y1="261" x2="264" y2="288"/>
    <line x1="480" y1="261" x2="480" y2="288"/>
    <line x1="696" y1="261" x2="696" y2="288"/>
    <line x1="264" y1="288" x2="696" y2="288"/>
    <line x1="480" y1="288" x2="480" y2="306"/>
  </g>

  <rect x="80" y="306" width="800" height="48" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="txt ink" x="480" y="326" font-size="12" font-weight="600" text-anchor="middle">agent containers — one per user</text>
  <text class="txt dim" x="480" y="343" font-size="10" text-anchor="middle">quota by tier · optional shared volume so a container can be rebuilt on another node</text>

  <text class="txt dim" x="480" y="386" font-size="10.5" text-anchor="middle">tunnels terminate here: a request for a connection this replica does not hold is relayed to the one that does</text>
</svg>
